<!doctype html><meta charset="utf-8">
<script src="../node_modules/tone/build/Tone.js"></script>
<script>
// The promo's score, rendered offline with Tone.js (open source). One cycle
// is 24 beats at 133.33 BPM = 10.8 s = the video's 324 frames, so music and
// picture loop together. Two cycles are rendered and the second kept, so
// reverb and tails wrap across the loop seam.
const BPM = 400 / 3, BEAT = 60 / BPM, CYCLE = 24 * BEAT, FR = 1 / 30;
const CUT = { hook: 0, reveal: 4, cities: 8, rumor: 11, spray: 15, widget: 18, brand: 21 }; // in beats

function wav(buffer) {
  const ch = buffer.numberOfChannels, len = buffer.length, sr = buffer.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); out.setUint32(4, 36 + len * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true); out.setUint32(24, sr, true);
  out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, len * ch * 2, true);
  const data = [...Array(ch)].map((_, c) => buffer.getChannelData(c));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, data[c][i])); out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; }
  let s = ''; const bytes = new Uint8Array(out.buffer); for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

window.renderScore = async () => {
  const buffer = await Tone.Offline(({ transport }) => {
    const master = new Tone.Compressor({ threshold: -16, ratio: 3, attack: 0.005, release: 0.15 });
    const limiter = new Tone.Limiter(-1).toDestination();
    const trim = new Tone.Gain(0.72).connect(limiter); // headroom before the limiter
    master.connect(trim);
    const verb = new Tone.Reverb({ decay: 2.6, wet: 1 }).connect(master);
    const send = node => { const g = new Tone.Gain(0.25); node.connect(g); g.connect(verb); return node; };

    // instruments
    const drone = new Tone.FMSynth({ harmonicity: 0.5, modulationIndex: 1.2, oscillator: { type: 'sine' }, envelope: { attack: 0.8, release: 2 } }).connect(new Tone.Filter(400, 'lowpass').connect(master));
    drone.volume.value = -14;
    const kick = new Tone.MembraneSynth({ pitchDecay: 0.045, octaves: 6, envelope: { attack: 0.001, decay: 0.32, sustain: 0 } }).connect(master); kick.volume.value = -3;
    const clap = send(new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.002, decay: 0.16, sustain: 0 } }).connect(new Tone.Filter(1800, 'bandpass').connect(master))); clap.volume.value = -12;
    const hat = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.04, sustain: 0 } }).connect(new Tone.Filter(8000, 'highpass').connect(master)); hat.volume.value = -22;
    const bassF = new Tone.Filter(520, 'lowpass').connect(master);
    const bass = new Tone.MonoSynth({ oscillator: { type: 'sawtooth' }, filter: { Q: 2 }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.5, release: 0.1 }, filterEnvelope: { attack: 0.002, decay: 0.18, sustain: 0.2, baseFrequency: 90, octaves: 3 } }).connect(bassF); bass.volume.value = -9;
    const padF = new Tone.Filter(1400, 'lowpass').connect(master);
    const pad = send(new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'fatsawtooth', count: 3, spread: 22 }, envelope: { attack: 0.25, decay: 0.3, sustain: 0.6, release: 0.8 } }).connect(padF)); pad.volume.value = -21;
    const pluck = send(new Tone.PluckSynth({ attackNoise: 1.2, dampening: 3800, resonance: 0.92 }).connect(master)); pluck.volume.value = -11;
    const blip = send(new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.001, decay: 0.07, sustain: 0, release: 0.02 } }).connect(master)); blip.volume.value = -20;
    const bell = send(new Tone.FMSynth({ harmonicity: 3.01, modulationIndex: 10, envelope: { attack: 0.001, decay: 1.2, sustain: 0, release: 1 }, modulationEnvelope: { attack: 0.002, decay: 0.4, sustain: 0 } }).connect(master)); bell.volume.value = -15;
    const hiss = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.02, decay: 0.32, sustain: 0.15, release: 0.12 } }); 
    const hissF = new Tone.Filter({ type: 'bandpass', frequency: 5200, Q: 0.8 }).connect(master); hiss.connect(hissF); hiss.volume.value = -14;
    const swoosh = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.08, decay: 0.3, sustain: 0, release: 0.1 } });
    const swooshF = new Tone.Filter({ type: 'bandpass', frequency: 900, Q: 1.2 }).connect(master); swoosh.connect(swooshF); swoosh.volume.value = -10;
    const click = new Tone.MembraneSynth({ pitchDecay: 0.005, octaves: 2, envelope: { attack: 0.001, decay: 0.03, sustain: 0 } }).connect(master); click.volume.value = -16;
    const riser = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.8, decay: 0.05, sustain: 1, release: 0.05 } });
    const riserF = new Tone.Filter({ type: 'bandpass', frequency: 400, Q: 1.5 }).connect(master); riser.connect(riserF); riser.volume.value = -18;
    const crackle = new Tone.NoiseSynth({ noise: { type: 'brown' }, envelope: { attack: 0.001, decay: 0.02, sustain: 0 } }).connect(new Tone.BitCrusher(4).connect(master)); crackle.volume.value = -12;

    const at = (cycle, beats) => cycle * CYCLE + beats * BEAT;
    const atF = (cycle, frame) => cycle * CYCLE + frame * FR;
    const SC = { hook: 0, reveal: 54, cities: 108, rumor: 149, spray: 203, widget: 243, brand: 284 }; // scene start frames
    const CH = [['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['C3', 'E3', 'G3'], ['G3', 'B3', 'D4']];
    const BASS = ['A1', 'F1', 'C2', 'G1'];
    for (let cyc = 0; cyc < 2; cyc++) {
      // the drone holds the whole cycle (and runs into the next)
      drone.triggerAttackRelease('A1', CYCLE + 0.2, at(cyc, 0));
      // HOOK: the board powers up, flips, the eyes open; a riser into the drop
      for (let i = 0; i < 7; i++) crackle.triggerAttackRelease(0.02, atF(cyc, i * 0.7));
      ['A5', 'G5', 'E5', 'D5', 'C5', 'A4'].forEach((n, i) => blip.triggerAttackRelease(n, 0.05, atF(cyc, 13 + i * 0.9)));
      bell.triggerAttackRelease('E6', 0.6, atF(cyc, 37));
      blip.triggerAttackRelease('E6', 0.03, atF(cyc, 44)); // the glance
      riser.triggerAttackRelease(BEAT * 2, at(cyc, 2));
      riserF.frequency.setValueAtTime(400, at(cyc, 2)); riserF.frequency.exponentialRampToValueAtTime(6000, at(cyc, 4));
      // THE DROP to the end of the widget: four on the floor, bass, pad, hats
      for (let b = CUT.reveal; b < CUT.brand + 1; b++) {
        kick.triggerAttackRelease('A0', 0.3, at(cyc, b));
        if (b % 2 === 1) clap.triggerAttackRelease(0.15, at(cyc, b));
        hat.triggerAttackRelease(0.03, at(cyc, b + 0.5));
        const bar = Math.floor(b / 4) % 4;
        if (b % 4 === 0) pad.triggerAttackRelease(CH[bar], BEAT * 3.6, at(cyc, b));
        bass.triggerAttackRelease(BASS[bar], BEAT * 0.4, at(cyc, b));
        bass.triggerAttackRelease(BASS[bar], BEAT * 0.2, at(cyc, b + 0.75));
      }
      // a pluck line over the cities and the widget
      const ARP = ['A4', 'C5', 'E5', 'A5', 'G5', 'E5', 'C5', 'E5'];
      for (let i = 0; i < 12; i++) pluck.triggerAttackRelease(ARP[i % 8], BEAT / 2, at(cyc, CUT.cities + i * 0.25));
      for (let i = 0; i < 10; i++) pluck.triggerAttackRelease(ARP[(i + 3) % 8], BEAT / 2, at(cyc, CUT.widget + i * 0.25));
      // REVEAL: the phone swings in
      swoosh.triggerAttackRelease(0.35, atF(cyc, SC.reveal));
      swooshF.frequency.setValueAtTime(2400, atF(cyc, SC.reveal)); swooshF.frequency.exponentialRampToValueAtTime(300, atF(cyc, SC.reveal + 12));
      // CITIES: two date swipes
      [6, 22].forEach(f => { swoosh.triggerAttackRelease(0.2, atF(cyc, SC.cities + f)); click.triggerAttackRelease('C6', 0.02, atF(cyc, SC.cities + f + 9)); });
      // RUMOR: a notification, the typing, the answer rising
      bell.triggerAttackRelease('B5', 0.2, atF(cyc, SC.rumor + 2));
      for (let i = 0; i < 10; i++) click.triggerAttackRelease('A6', 0.01, atF(cyc, SC.rumor + 3 + i));
      swoosh.triggerAttackRelease(0.3, atF(cyc, SC.rumor + 14));
      // SPRAY: three cans, then the counter
      [4, 11, 18].forEach(f => { hiss.triggerAttackRelease(0.3, atF(cyc, SC.spray + f)); });
      blip.triggerAttackRelease('E6', 0.05, atF(cyc, SC.spray + 24)); blip.triggerAttackRelease('A6', 0.08, atF(cyc, SC.spray + 26));
      // WIDGET: glass
      bell.triggerAttackRelease('A6', 0.3, atF(cyc, SC.widget + 4));
      // BRAND: a chord hit, then everything drops away into the drone
      pad.triggerAttackRelease(['A3', 'E4', 'A4', 'C5'], BEAT * 1.8, at(cyc, CUT.brand));
      bell.triggerAttackRelease('A5', 1, at(cyc, CUT.brand));
      padF.frequency.setValueAtTime(1400, at(cyc, CUT.brand + 1)); padF.frequency.exponentialRampToValueAtTime(260, at(cyc, 24) - 0.05);
      padF.frequency.setValueAtTime(1400, at(cyc, 24));
    }
  }, CYCLE * 2 + 0.1, 2, 48000); // a little past the end, so the slice never runs short
  // keep the second cycle: its start already carries the first one's tails
  const sr = buffer.sampleRate, n = Math.round(CYCLE * sr);
  const ctx = new OfflineAudioContext(2, n, sr);
  const out = ctx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) out.getChannelData(c).set(buffer.getChannelData(c).slice(n, 2 * n));
  return wav(out);
};
</script>
