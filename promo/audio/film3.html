<!doctype html><meta charset="utf-8">
<script src="../node_modules/tone/build/Tone.js"></script>
<script>
// The v3 film's score (Tone.js, rendered offline). It follows the story:
// tense and muffled in the tangle, a chime when it untangles, warmth on the
// promise, a light groove while you ask and it works, the sources ticking

const FPS = 30;

    drone.triggerAttackRelease('D2', F(S.title), 0);

    // 2 promise: the light comes up
    padF.frequency.setValueAtTime(500, F(S.title)); padF.frequency.linearRampToValueAtTime(1600, F(S.title + 40));
    pad.triggerAttackRelease(['A3', 'C4', 'E4', 'B4'], F(96) + 0.5, F(S.title));
    keys.triggerAttackRelease(['E5'], 1.2, F(S.title + 10));

    const g0 = F(S.ask + 24), g1 = F(S.payoff);
    const CH = [['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['C3', 'E3', 'G3'], ['G3', 'B3', 'D4']], BS = ['A1', 'F1', 'C2', 'G1'];

    tick.triggerAttackRelease('E6', 0.04, F(S.ask + 128)); air.triggerAttackRelease(0.3, F(S.ask + 129));
    // 4 working: sparkles
    for (let i = 0; i < 10; i++) tick.triggerAttackRelease(['A6', 'E6', 'C7', 'G6'][i % 4], 0.03, F(S.working + 6 + i * 6.5));
    // 5 how: ticks, branches, boxes, the answer
    [40, 72].forEach(fr => tick.triggerAttackRelease('C6', 0.05, F(S.how + fr)));
    air.triggerAttackRelease(0.5, F(S.how + 92));
    [112, 124, 136].forEach((fr, i) => pop.triggerAttackRelease(['G3', 'A3', 'C4'][i], 0.08, F(S.how + fr)));
    air.triggerAttackRelease(0.5, F(S.how + 158));
    keys.triggerAttackRelease(['A4', 'E5', 'A5'], 1.6, F(S.how + 184));
    // 6 answer + 7 the day
    air.triggerAttackRelease(0.4, F(S.answer + 2)); keys.triggerAttackRelease(['C5'], 1, F(S.answer + 20));
    tick.triggerAttackRelease('C6', 0.04, F(S.day + 6)); air.triggerAttackRelease(0.3, F(S.day + 8));
    pop.triggerAttackRelease('E4', 0.08, F(S.day + 96)); ping.triggerAttackRelease('B5', 0.4, F(S.day + 97));
    // 8 italy: each city its own note, up the scale
    const PENT = ['A4', 'C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6', 'G6'];
    for (let i = 0; i < 20; i++) ping.triggerAttackRelease(PENT[Math.min(9, Math.floor(i / 2))], 0.4, F(S.italy + 34 + i * 3.2));
    // 9 payoff: everything settles on one chord; 10 the name, and quiet
    pad.triggerAttackRelease(['A3', 'E4', 'A4', 'C5'], F(120) + 1, F(S.payoff));
    keys.triggerAttackRelease(['A4', 'C5', 'E5'], 2, F(S.payoff + 4));
    keys.triggerAttackRelease(['E5', 'A5'], 2, F(S.payoff + 34));
    ping.triggerAttackRelease('A5', 1.2, F(S.logo + 2));
  }, LEN, 2, 48000);
  return wavB64(buffer);

  dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, len * ch * 2, true);

}
</script>
