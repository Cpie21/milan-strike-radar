<!doctype html><meta charset="utf-8">
<script src="../node_modules/tone/build/Tone.js"></script>
<script>
// v4 score: 120 BPM, on the same beat grid as the picture (src/v4/beat.ts).
// Rises and falls like a short: a tense build under the pile-up, DROP on the
// promise, a groove while you type, a dive and a hush, the sources in
// half-time, DROP on the answer, a lift on the decision, twenty cities as a

    const hat = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.035, sustain: 0 } }).connect(hatF); hat.volume.value = -20;

    const bass = new Tone.MonoSynth({ oscillator: { type: 'sawtooth' }, filter: { Q: 1.5 }, envelope: { attack: 0.005, decay: 0.2, sustain: 0.6, release: 0.1 }, filterEnvelope: { attack: 0.002, decay: 0.2, sustain: 0.3, baseFrequency: 80, octaves: 3 } }).connect(bassF); bass.volume.value = -8;

    const pad = wet(new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'fatsawtooth', count: 3, spread: 24 }, envelope: { attack: 0.02, decay: 0.4, sustain: 0.5, release: 0.6 } }).connect(padF), 0.4); pad.volume.value = -17;
    const stab = wet(new Tone.PolySynth(Tone.FMSynth, { harmonicity: 2, modulationIndex: 3, envelope: { attack: 0.002, decay: 0.6, sustain: 0, release: 0.5 } }).connect(bus), 0.4); stab.volume.value = -11;

    const bell = wet(new Tone.FMSynth({ harmonicity: 3.01, modulationIndex: 9, envelope: { attack: 0.001, decay: 1.1, sustain: 0, release: 1 }, modulationEnvelope: { attack: 0.002, decay: 0.35, sustain: 0 } }).connect(bus), 0.5); bell.volume.value = -13;
    // fx
    const noiseF = new Tone.Filter({ type: 'bandpass', frequency: 500, Q: 1.2 }).connect(bus);
    const noise = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.6, decay: 0.05, sustain: 1, release: 0.05 } }).connect(noiseF); noise.volume.value = -15;
    const whooshF = new Tone.Filter({ type: 'bandpass', frequency: 900, Q: 1 }).connect(bus);
    const whoosh = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.06, decay: 0.25, sustain: 0, release: 0.1 } }).connect(whooshF); whoosh.volume.value = -8;
    const typeF = new Tone.Filter({ type: 'bandpass', frequency: 3600, Q: 1.3 }).connect(bus);
    const type = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.02, sustain: 0 } }).connect(typeF); type.volume.value = -16;
    const sub = new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.002, decay: 0.9, sustain: 0, release: 0.2 } }).connect(bus); sub.volume.value = -6;

    sub.triggerAttackRelease('A1', 0.8, at('chaos', 5)); sweep(at('chaos', 5), 3000, 300, 0.4); // the board drops
    sweep(at('chaos', 6.4), 300, 4000, 0.9); // pulled in
    ['A5', 'E6', 'A6'].forEach((n, i) => bell.triggerAttackRelease(n, 0.5, at('chaos', 7.5 + i * 0.25))); // it lights
    riser(at('chaos', 7.5), at('title', 0));
    // 2 DROP: the promise
    kick.triggerAttackRelease('A0', 0.5, at('title', 0)); sub.triggerAttackRelease('A1', 1.2, at('title', 0)); stab.triggerAttackRelease(CH.Am, 1, at('title', 0));
    pad.triggerAttackRelease(CH.Am, BEAT * 3, at('title', 0)); bell.triggerAttackRelease('E6', 0.8, at('title', 1.5));
    sweep(at('title', 3.6), 400, 3000, 0.4); // the phone flies in
    // 3 typing in the groove
    groove('ask', 0, 8, ['Am', 'F']);
    typing.forEach(fr => type.triggerAttackRelease(0.02, S.ask / 30 + fr / 30));
    clap.triggerAttackRelease(0.2, at('ask', 98 / 15)); stab.triggerAttackRelease(['E5', 'A5'], 0.4, at('ask', 98 / 15)); // send
    // 4 the dive: everything falls away into the face
    sweep(at('dive', 0), 5000, 200, 0.95); riser(at('dive', 0), at('dive', 2), 6000, 300, -17);
    // 5 sources in half-time, one bell per source, back together
    sub.triggerAttackRelease('A1', 0.8, at('sources', 0));
    groove('sources', 1, 8, ['F', 'G'], { half: true, bassOn: false });
    [2, 3, 4].forEach((bt, i) => bell.triggerAttackRelease(['C6', 'E6', 'G6'][i], 0.6, at('sources', bt)));
    riser(at('sources', 4.5), at('sources', 5.75), 400, 5000, -16); stab.triggerAttackRelease(CH.C, 0.8, at('sources', 5.75));
    sweep(at('sources', 7.4), 300, 5000, 0.35);
    // 6 DROP: the answer
    sub.triggerAttackRelease('A1', 1, at('answer', 0)); stab.triggerAttackRelease(CH.Am, 0.8, at('answer', 0));
    groove('answer', 0, 6, ['Am', 'F']);
    stab.triggerAttackRelease(['A4', 'E5'], 0.5, at('answer', 28 / 15)); sweep(at('answer', 48 / 15), 400, 3500, 0.3); stab.triggerAttackRelease(['C5', 'G5'], 0.5, at('answer', 56 / 15));
    // 7 the day, and the lift when you decide
    groove('day', 0, 6, ['C', 'G']);
    pluck.triggerAttackRelease('E5', 0.5, at('day', 6 / 15)); sweep(at('day', 16 / 15), 400, 3000, 0.3);
    stab.triggerAttackRelease(CH.C, 1, at('day', 3)); bell.triggerAttackRelease('G6', 0.8, at('day', 3));
    // 8 italy: twenty cities as a rising run
    groove('italy', 0, 8, ['Am', 'F', 'C', 'G'], { hats: true });
    const RUN = ['A4', 'C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6', 'G6'];
    for (let i = 0; i < 20; i++) pluck.triggerAttackRelease(RUN[Math.floor(i / 2)], 0.4, S.italy / 30 + (10 + i * 3.75) / 30);
    riser(at('italy', 6), at('payoff', 0), 300, 6000, -18);
    // 9 breakdown: the payoff
    sub.triggerAttackRelease('A1', 1.4, at('payoff', 0)); pad.triggerAttackRelease(CH.F, BEAT * 3.8, at('payoff', 0)); pad.triggerAttackRelease(CH.C, BEAT * 2, at('payoff', 4));
    bell.triggerAttackRelease('A5', 1, at('payoff', 0)); bell.triggerAttackRelease('E6', 1, at('payoff', 2));
    // 10 the name, one hit, then quiet so the loop can start again
    kick.triggerAttackRelease('A0', 0.6, at('logo', 0)); stab.triggerAttackRelease(['A3', 'E4', 'A4', 'C5'], 1.6, at('logo', 0)); sub.triggerAttackRelease('A1', 1.5, at('logo', 0));
    Q.sort((x, y) => x[1][x[1].length - 1] - y[1][y[1].length - 1]).forEach(([fn, args]) => fn(...args));
  }, LEN, 2, 48000);
  return wavB64(buffer);
};

}
</script>
